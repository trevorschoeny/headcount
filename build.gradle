// Headcount: counts the entities crammed into the block you look at, lets you scroll to
// pick one out of the crowd, and keeps range counts on the HUD. Universal Fabric mod
// (environment "*"): the crowd count and the pick are client-only; range counts and the
// real maxEntityCramming value come from the optional server half. Depends on MenuKit
// (HUD readout, and the range list once Emerald's list editing lands); nothing here
// touches slots, so no SlotKit.
//
// Build: `./gradlew :headcount:build` from the workspace root (the composite
// build in ~/Projects/Minecraft/Trevlar Mods). Test scene:
// `test-gallery/run-scene.sh headcount <scene>`.

plugins {
    // Loom 1.17 is the 26.2-era line; the version is pinned at the workspace root.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java'
    id 'com.modrinth.minotaur' version '2.+'
}

version = property('headcount_version')
group   = property('maven_group')

base.archivesName = 'headcount'

java {
    // Minecraft 26.x runs on Java 25.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    // ModMenu, from Terraformers' Maven.
    maven { url 'https://maven.terraformersmc.com/releases/' }
}

// MenuKit splits into main and client source sets. A project dependency sees only
// main, so its client half (the HUD API) is added by output below, which needs MenuKit
// evaluated first.
evaluationDependsOn(':menukit')

dependencies {
    // 26.x: the game is unobfuscated, so there is no mappings line and mod deps use
    // the standard java configurations.
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    implementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"

    // HUD readout through MenuKit. Only MenuKit is on the classpath, which proves
    // nothing here reaches SlotKit.
    implementation project(':menukit')
    implementation rootProject.project(':menukit').sourceSets.client.output

    // ModMenu opens the settings screen from the mods list (Mod Hub reads the same
    // entrypoint). Soft dep at runtime: compileOnly for the API, localRuntime for the dev launch.
    compileOnly "com.terraformersmc:modmenu:21.0.0"
    localRuntime "com.terraformersmc:modmenu:21.0.0"
}

loom {
    runs {
        client { ideConfigGenerated = false }
        server { ideConfigGenerated = false }
        // Test Gallery: boots straight into the generated test world in run/saves/TestGallery.
        // Generate it with `test-gallery/run-scene.sh headcount <scene>` (which also runs this).
        testGallery {
            inherit client
            name 'Test Gallery'
            programArgs '--quickPlaySingleplayer', 'TestGallery'
            ideConfigGenerated = false
        }
    }
}


// Self-checks: Fabric client gametests in src/gametest, run with `./gradlew :headcount:runClientGameTest`.
// Each one loads a Test Gallery scene's check world (gen.py --checks) and asserts what a
// station with a matching "check" id says, so Trev's walk-through keeps only what needs his eyes.
// The run opens its own window, runs every check, and closes; it never touches run/ or a scene client.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'headcount_checks'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
apply from: rootProject.file('Trevlar Mods Codebases/test-gallery/kit/checks.gradle')   // SceneWorld

jar {
    from('LICENSE') { rename { "${it}_${project.name}" } }
}

// Stamp the real project version into fabric.mod.json at build. The manifest
// declares "version": "${version}"; a hardcoded manifest version silently breaks
// every dependency gate against this mod.
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

// ── Modrinth Publishing ────────────────────────────────────────────────
// Lead creates the Modrinth project (new-mod-setup.md) and fills in the project id
// here. Only Lead runs these tasks.
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    // No Modrinth project until Trev approves the first release (new-mod-setup.md step 7).
    // Left empty so a publish fails instead of creating one.
    projectId = ""
    versionNumber = property('headcount_version')
    versionName = "Headcount ${property('headcount_version')}"
    versionType = "release"
    // ci-cd.md stage 5: the player-facing changelog lives in changelog.md, one entry,
    // overwritten each release (git keeps the history).
    changelog = file('changelog.md').text
    // ci-cd.md stage 7: the README is the public description; `modrinthSyncBody` pushes it.
    syncBodyFrom = file('README.md').text
    // 26.x: no remap step — `jar` IS the shippable artifact.
    uploadFile = jar
    gameVersions = [property('minecraft_version')]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        required.project "menukit"
    }
}

// The shipped jar must self-report the bumped version. A jar that says the wrong
// version silently breaks every dependency gate against it, so this fails the build
// instead of relying on someone remembering to unzip and look.
tasks.register('verifyJarVersion') {
    dependsOn 'jar'
    doLast {
        def jar = tasks.named('jar').get().archiveFile.get().asFile
        def modJson = zipTree(jar).matching { include 'fabric.mod.json' }.singleFile
        def stamped = new groovy.json.JsonSlurper().parse(modJson).version
        if (stamped != project.version.toString()) {
            throw new GradleException("${jar.name}: fabric.mod.json says ${stamped}, expected ${project.version}")
        }
        println "verifyJarVersion: ${jar.name} reports ${stamped}"
    }
}
build.dependsOn verifyJarVersion

// Kit range check: the workspace root build supplies its logic (it replaces this
// task's action in every subproject), so it is only registered here.
tasks.register('verifyKitRanges')
build.dependsOn verifyKitRanges
